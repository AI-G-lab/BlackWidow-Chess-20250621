# BlackWidow Chess Configuration File
# This file contains secure configuration settings

# Database Configuration
db.url=jdbc:sqlite:chess_games.db
db.driver=org.sqlite.JDBC
db.username=
db.password=

# Network Configuration
network.max.connections=10
network.timeout=30000

# Security Configuration
security.max.message.size=1048576
security.enable.logging=true

# Game Configuration
game.default.search.depth=6
game.max.search.depth=12

# GUI Configuration
gui.piece.icon.path=art/holywarriors/
gui.async.image.loading=true
gui.cache.images=true

# Performance Configuration
performance.enable.caching=true
performance.max.cache.size=10000
performance.lazy.initialization=true
